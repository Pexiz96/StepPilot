name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-and-regression:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore StepPilot.slnx

      - name: Build release with warnings as errors
        run: dotnet build StepPilot.slnx --configuration Release --no-restore -warnaserror

      - name: Run regression checks
        run: dotnet run --project StepPilot.Tests/StepPilot.Tests.csproj --configuration Release --no-build
